services:
  db:
    image: postgres:16-alpine
    container_name: garra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: garra
      POSTGRES_PASSWORD: garra
      POSTGRES_DB: garra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garra -d garra"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: garra_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "host=db user=garra password=garra dbname=garra port=5432 sslmode=disable TimeZone=America/Santiago"
      PORT: ":8080"
      SEED_ON_STARTUP: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
