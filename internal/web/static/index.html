<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- CSP estricta: solo recursos del propio servidor, sin scripts inline ni externos -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-ancestors 'none'">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Reporta y gestiona emergencias veterinarias desde tu teléfono">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Código Garra">
  <title>Código Garra — Emergencias Veterinarias</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ══════════ Vista: Login / Registro ══════════ -->
  <div id="vista-login" class="oculto">
    <div class="login-fondo">
      <div class="login-card">
        <div class="login-logo">🐾</div>
        <h1>Código Garra</h1>
        <p class="login-subtitulo">Plataforma de emergencias veterinarias</p>

        <div id="login-aviso" class="aviso oculto"></div>

        <form id="form-login" autocomplete="on">
          <label for="login-email">Correo electrónico</label>
          <input id="login-email" type="email" required autocomplete="username"
                 placeholder="usuario@codigogarra.vet">

          <label for="login-password">Contraseña</label>
          <input id="login-password" type="password" required minlength="6"
                 autocomplete="current-password" placeholder="••••••••">

          <label class="campo-check login-recordar">
            <input id="login-recordar" type="checkbox">
            <span>Recordarme en este dispositivo</span>
          </label>

          <button type="submit" class="btn btn-primario btn-bloque" id="btn-login">Ingresar</button>
        </form>

        <button type="button" class="btn btn-suave btn-bloque oculto btn-instalar">📲 Instalar aplicación</button>

        <p class="login-alternar">
          <span id="texto-alternar">¿No tienes cuenta?</span>
          <button type="button" class="btn-enlace" id="btn-alternar">Regístrate</button>
        </p>

        <div class="login-demo">
          <p>Cuentas de demostración (seeder):</p>
          <div class="login-demo-botones">
            <button type="button" class="btn btn-suave" id="btn-demo-admin">👑 Admin</button>
            <button type="button" class="btn btn-suave" id="btn-demo-vet">🩺 Veterinario</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ══════════ Vista: Aplicación ══════════ -->
  <div id="vista-app" class="oculto">
    <header class="topbar">
      <div class="topbar-marca">🐾 <strong>Código Garra</strong></div>
      <div class="topbar-usuario">
        <span id="usuario-email"></span>
        <span id="usuario-rol" class="badge"></span>
        <button type="button" class="btn btn-suave oculto btn-instalar">📲 Instalar</button>
        <button type="button" class="btn btn-suave" id="btn-salir">Salir</button>
      </div>
    </header>

    <nav class="pestanas" id="pestanas"></nav>

    <main id="contenido" class="contenido"></main>
  </div>

  <div id="toast" class="toast oculto"></div>

  <script src="app.js"></script>
</body>
</html>
